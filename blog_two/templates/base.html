<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% block styles %}{% endblock %}
</head>

<style>

    :root{
        --backgrount_color:#95d5b2;
        --color:#1b4332;
        --color_hover:#10271d;
        --card_background:#ffffff;
    }


    body{
        margin: 0;
        padding: 0;
    }

    nav{
        width: 100%;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        background-color: var(--backgrount_color);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        
    }

    a{
        font-size: 25px;
        text-decoration: none;
        color: var(--color);
        transition: 0.5s;
        font-weight: bold;
    }

    a:hover{
        transform: translateY(-4px);
        color: var(--color_hover);
        
    }

    .entrance{

        width: 40vh;
        height: 9vh;
        background-color: var(--color);
        color: var(--card_background);
        text-decoration: none;
        transition: 0.5s;
        border-radius: 1000px;
        font-size: 25px;
        text-align: center;
    }

    .entrance:hover{
        transform: translateY(-4px);
        color: var(--card_background);
       
    }


</style>
<body>
    <header>
        <nav>
            
            <a href="#">о сайте</a>
            
            {% if user.is_authenticated  %}
                <a href="{% url 'list-posts' %}">главная</a>
                <a href="{% url 'create-post' %}">создать запись</a>
                <a href="{% url 'users-profile' %}">профиль</a>
                <form action="{% url 'users-logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="entrance">выход</button>
                </form>
            



            {% endif %}


        </nav>

    </header>

    <main>
        {% block content %}

        {% endblock %}

    </main>

    <footer>

        <p>&copy; 2026. node</p>
    </footer>
</body>
</html>
