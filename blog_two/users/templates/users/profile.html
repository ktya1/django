{% extends 'base.html' %}

{% block styles %}
    <style>
    :root{
        --backgrount_color:#111727;
        --color:#aa1441;
        --color_hover:#10271d;
        --background:#111727;
    }

    body{
        margin: 0;
        padding: 0;
        background-color: var(--backgrount_color);
        display: flex;
        flex-direction: column;
        width: auto;
    }

    .conteiner_profile{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        max-height: 420px;
        background-color: var(--background);
        border: 2px solid var(--color);
        border-radius: 20px;
        padding: 40px 35px;
        box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2);
        display: flex;
        
        justify-content: center;
        text-align: center;
        flex-direction: column;
        color: var(--color);
        box-sizing: border-box;
        margin: 20px;
        width: 100%;
    }
    .your_name{
        font-size: 30px;
        
    }
    .name_register{
        text-transform: uppercase;
    }


</style>
{% endblock %}

{% block content%}
    <div class="conteiner_profile">
        <h1 class="name_register">ПРОФИЛЬ</h1>
        <p class="your_name">ник: {{user.username}}</p>
        <p class="your_name">дата регистрации: {{user.date_joined}}</p>



    </div>
    
{% endblock %}
