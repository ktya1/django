

{% extends 'base.html' %}

{% block styles %}
    <style>
    :root{
        --backgrount_color:#95d5b2;
        --color:#1b4332;
        --color_hover:#10271d;
        --card_background:#ffffff;
    }

    body{
        margin: 0;
        padding: 0;
        background-color: var(--backgrount_color);
        display: flex;
        flex-direction: column;
        width: auto;
    }

    .conteiner_register{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        max-height: 420px;
        background-color: var(--card_background);
        border: 2px solid var(--color);
        border-radius: 20px;
        padding: 40px 35px;
        box-shadow: 0 15px 35px rgba(27, 67, 50, 0.5);
        display: flex;
        align-items: stretch;
        justify-content: center;
        text-align: center;
        flex-direction: column;
        color: var(--color);
        box-sizing: border-box;
        margin: 20px;
        width: 100%;
    }

    .entrance_register{
        color: var(--color_hover) ;
        width: 40vh;
        height: 10vh;
        background-color: var(--color);
        color: var(--card_background);
        text-decoration: none;
        transition: 0.5s;
        border-radius: 10px;
        font-size: 20px;
    }

    .entrance_register:hover{
        transform: translateY(-4px);
    }

    form p {
        margin: 8px 0;
    }


    form label {
        display: block;
        margin-top: 12px;
        font-weight: 600;
        color: var(--text-color);
    }

    form input[type="text"], form input[type="password"] {
        width: 50%;
        padding: 10px;
        border: 1px solid var(--color_hover);
        border-radius: 4px;
        box-sizing: border-box; 

    }

    .entrance_name_register{
        font-size: 40px;
        letter-spacing: 5px; 
        font-weight: 900;
    }

</style>
{% endblock %}



{% block content%}
    <div class="conteiner_register">

        <h1 class="entrance_name_register">РЕГИСТРАЦИЯ </h1>
        <form action="" method="post">
            {% csrf_token %}
            {{ form.as_p  }} 
            <button type="submit" class="entrance_register"> зарегестрироваться</button>

             <p>есть аккаунт? <a href="{% url 'users-login' %}">вход</a></p>
        </form>



        {% if form.errors %}
            <p style="color: red;">неверное имя пользователя или пароль</p>

        {% endif %}

    </div>
{% endblock %}
