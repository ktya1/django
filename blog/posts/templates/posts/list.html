{% extends 'base.html' %}


{% block content %}

            <h2>
                <a href="{% url 'read-post' post.id %}">{{post.title}}</a>
            </h2>


        <hr>
    {% empty %}
        <p>постов пока нет</p>
    {% endfor %}
{% endblock %}
